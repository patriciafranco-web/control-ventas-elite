services:
  - type: web
    name: control-ventas-elite
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ventas-elite-db
          property: connectionString
      - key: ADMIN_USER
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "CambiarClaveSegura2026"
      - key: ADMIN_PIN
        value: "2026"
      - key: SESSION_SECRET
        generateValue: true
      - key: CARGAR_DEMO
        value: "false"
      - key: EMPRESA_NOMBRE
        value: "MEDYSIS"
      - key: EMPRESA_RUC
        value: "4775796-5"
      - key: EMPRESA_LOGO
        value: "/static/logo.png.jpeg"
      - key: ALIAS_PAGO
        value: "Alias / Cuenta Bancaria aquí"

databases:
  - name: ventas-elite-db
    databaseName: ventas_elite
    user: admin_elite